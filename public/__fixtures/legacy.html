<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Legacy fixture, no viewport meta</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 24px; }
    .shell { width: 960px; }
    h1 { font-size: 32px; margin: 0 0 12px; }
    p { margin: 0 0 12px; color: #444; }
  </style>
</head>
<body>
  <div class="shell">
    <h1>A page written before phones</h1>
    <p>The layout is a fixed 960px column and there is no viewport meta tag, so a phone
      lays this out at 980px and zooms the whole thing out to fit the screen.</p>
    <p>Nothing here responds to width.</p>
  </div>
</body>
</html>
